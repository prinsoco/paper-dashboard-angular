<div class="row">
    <div class="col-md-8">
    <div class="card card-user">
      <div class="card-header">
        <h5 class="card-title">{{ titleForm }}</h5>
      </div>
      <div class="card-body">
        <form>
            <div class="row">
            <div class="col-md-6 pr-1">
              <div class="form-group">
                <label>Nombres</label>
                <input type="text" formControlName="nombres" class="form-control" placeholder="Nombres" value="Vanessa">
              </div>
            </div>
            <div class="col-md-6 pl-1">
              <div class="form-group">
                <label>Apellidos</label>
                <input type="text" formControlName="apellidos" class="form-control" placeholder="Apellidos" value="Aguas">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 pr-1">
              <div class="form-group">
                <label>Identificacion</label>
                <input type="text" formControlName="identificacion" class="form-control" placeholder="Identificación" value="0999999999">
              </div>
            </div>
            <div class="col-md-4 px-1">
              <div class="form-group">
                <label>Usuario</label>
                <input type="text" formControlName="usuario" disabled="" class="form-control" placeholder="Usuario" value="usumedicare">
              </div>
            </div>
            <div class="col-md-4 pl-1">
              <div class="form-group">
                <label>Email</label>
                <input type="text" formControlName="email" class="form-control" placeholder="Email" value="tu@correo.com">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-2 pr-1">
              <div class="form-group">
                <label>Edad</label>
                <input type="number" formControlName="edad" class="form-control" placeholder="Edad" value="18">
              </div>
            </div>
            <div class="col-md-5 px-1">
              <div class="form-group">
                <label>Teléfono</label>
                <input type="text" formControlName="telefono" class="form-control" placeholder="Teléfono" value="2334238">
              </div>
            </div>
            <div class="col-md-5 pl-1">
              <div class="form-group">
                <label>Celular</label>
                <input type="number" maxlength="10" formControlName="celular" class="form-control" placeholder="Celular" value="0923342389">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label>Dirección</label>
                <input type="text" formControlName="direccion" class="form-control" placeholder="Dirección" value="Centro - Sur">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="update ml-auto mr-auto">
              <button type="button" class="btn btn-primary btn-round" *ngIf="this.action == 'add'" (click)="createRegistro()">Agregar</button>
              <button type="button" class="btn btn-primary btn-round" *ngIf="this.action == 'edit'" (click)="editRegistro()">Actualizar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card card-user">
      <div class="card-header">
        <h5 class="card-title">Resetear Contraseña</h5>
      </div>
      <div class="card-body">
        <form>
           
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label>Nueva Contraseña</label>
                <input type="password" class="form-control" placeholder="Contraseña" value="******">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="update ml-auto mr-auto">
              <button type="button" class="btn btn-primary btn-round" (click)="resetearClave()">Resetear</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
